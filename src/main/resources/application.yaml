spring:
  application:
    name: tp02_sistema_bancario


  datasource:
    url: jdbc:mysql://localhost:3306/tp02_sistema_bancario?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: admin
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # 'update' genera tablas si no existen sin intentar eliminar restricciones previas inexistentes

    open-in-view: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true # Mantiene la carga de data.sql tras crear/actualizar esquema
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always # Mantiene la ejecución de data.sql al iniciar

  spring:
    mail:
      host: smtp.gmail.com
      port: 587
      username: ${MAIL_USERNAME}
      password: ${MAIL_PASSWORD}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true